<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Domain Dijeda Sementara</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 620px;
      text-align: center;
      background: #ffffff;
      padding: 55px 35px;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.06);
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff7ed;
      color: #ea580c;
      font-size: 34px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 15px;
      color: #111827;
    }

    .description {
      font-size: 16px;
      line-height: 1.7;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .domain {
      display: inline-block;
      padding: 10px 16px;
      margin-bottom: 25px;
      border-radius: 8px;
      background: #f3f4f6;
      color: #374151;
      font-family: monospace;
      font-size: 14px;
    }

    .notice {
      padding: 15px 18px;
      margin-top: 10px;
      border-radius: 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
    }

    footer {
      margin-top: 30px;
      font-size: 12px;
      color: #9ca3af;
    }

    @media (max-width: 480px) {
      .container {
        padding: 40px 22px;
      }

      h1 {
        font-size: 25px;
      }

      .description {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="icon">
      ⏸
    </div>

    <h1>Domain Ini Dijeda Sementara</h1>

    <div class="domain">
      example.com
    </div>

    <p class="description">
      Website ini sedang dijeda sementara dan untuk saat ini
      tidak dapat diakses seperti biasa.
    </p>

    <div class="notice">
      Silakan coba kembali beberapa saat lagi.
      Terima kasih atas pengertiannya.
    </div>

    <footer>
      &copy; 2026 example.com
    </footer>

  </main>

</body>
</html>
